server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Only these specific, public API prefixes are proxied to backend services.
  # Every backend service's /internal/* routes are deliberately NOT listed here
  # anywhere — meaning they are never reachable through this reverse proxy,
  # regardless of what a browser or attacker requests.

  location /api/v1/auth/ {
    proxy_pass http://auth:4001/api/v1/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/v1/accounts/ {
    proxy_pass http://accounts:4002/api/v1/accounts/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/v1/transactions/ {
    proxy_pass http://transactions:4003/api/v1/transactions/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}

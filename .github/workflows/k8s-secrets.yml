name: Sync Kubernetes Secrets

on:
  push:
    branches: [ main ]

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Sync ECR imagePullSecret
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          kubectl create secret docker-registry regcred \
            --docker-server=423716046426.dkr.ecr.us-east-1.amazonaws.com \
            --docker-username=AWS \
            --docker-password="$ECR_TOKEN" \
            --docker-email=none@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync accounts-service secrets
        run: |
          kubectl create secret generic accounts-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=INTERNAL_SERVICE_SECRET="${{ secrets.INTERNAL_SERVICE_SECRET }}" \
            --from-literal=MONGO_URL="${{ secrets.MONGO_URL_ACCOUNTS }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy MongoDB
        run: kubectl apply -f k8s/mongo/
      - name: Deploy accounts-service
        run: |
          kubectl apply -f k8s/accounts/
          kubectl rollout status deployment/accounts --timeout=180s
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    # Not published on the host; only reachable from the compose network, with auth.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}

  auth:
    build: ./services/auth-service
    environment:
      PORT: 4001
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/novabank_auth?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-NovaBank <no-reply@example.com>}
      ACCOUNTS_URL: http://accounts:4002
    depends_on: [mongo, accounts]

  accounts:
    build: ./services/accounts-service
    environment:
      PORT: 4002
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/novabank_accounts?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
    depends_on: [mongo]

  transactions:
    build: ./services/transactions-service
    environment:
      PORT: 4003
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/novabank_transactions?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env}
      AUTH_URL: http://auth:4001
      ACCOUNTS_URL: http://accounts:4002
    depends_on: [mongo, auth, accounts]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [auth, accounts, transactions]

volumes:
  mongo_data:
